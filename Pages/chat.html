<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Red berry-Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="icon" type="image/x-icon" href="/AI-plans/Project/assets/css/images/favicon.ico">
  <link rel="stylesheet" href="/Pages/styles/chat.css" />
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <div class="container">
    
    <nav class="navbar-card">
      <a href="#" class="logo-container">
        <img src="/Pages/styles/images/favicon.ico" alt="BlueBerry Logo">
        <span>Red berry</span>
      </a>

      <div class="nav-buttons">
        <a href="./red-berry.html" class="nav-button">Chat</a>
        <a href="./Index.html" class="nav-button">Menu</a>
  
      </div>

      <!-- Model selector for choosing which model to use -->
      <label for="modelSelect" class="sr-only">Model</label>
      <select id="modelSelect" aria-label="Select AI model" class="nav-button" title="Select model">
        <option value="gemini-2.5-flash-preview-09-2025">Gemini 2.5 Flash</option>
        <option value="gemini-1.0">Gemini 1.0</option>
      </select>

      <div class="menu-container">
        <button class="menu-toggle" onclick="toggleDropdown()">
          <i class="fas fa-ellipsis-v"></i>
        </button>
        
        <div id="dropdownMenu" class="dropdown-content">
          <a href="#"><i class="fas fa-home"></i> Home</a>
          <a href="#"><i class="fas fa-cog"></i> Settings</a>
          <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </nav>
    
    <main class="wrap">
      <section class="card">
        <div class="chat-panel" id="chat"> 
          <div class="messages" role="log" aria-live="polite" aria-atomic="false">
              <div class="message received">Hello! How can I help?</div>
            </div>
          
          <div class="message received" id="typing-indicator" style="display:none;">
             <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
             </div>
          </div>
          
          <div class="chat-input">
            <input id="chatInput" type="text" placeholder="Type a message..." aria-label="Message input" />
            <button id="sendButton" onclick="sendMessage()" aria-label="Send message">Send</button>
          </div>
        </div>
        
        <div class="content-panel" id="content"> 
          <div class="tool-container">
            <button class="tools-toggle" onclick="toggleToolsDropdown()" aria-haspopup="true" aria-expanded="false" aria-controls="toolsDropdownMenu">
              <i class="fas fa-tools" aria-hidden="true"></i>
            </button>

            <!-- Quick actions: Copy and Clear -->
            <button id="btn-copy" class="nav-button" title="Copy quiz content" onclick="copyContent()" aria-label="Copy content">
              <i class="fas fa-copy"></i>
            </button>
            <button id="btn-clear" class="nav-button" title="Clear chat and content" onclick="clearChat()" aria-label="Clear chat">
              <i class="fas fa-trash-alt"></i>
            </button>

            <div id="toolsDropdownMenu" class="tools-dropdown-content" role="menu">
              <a href="#" role="menuitem" onclick="toggleEdit(); return false;"><i class="fas fa-pencil-alt"></i> Edit Content</a>
              <a href="#" role="menuitem"><i class="fas fa-share-alt"></i> Share Result</a>
              <a href="#" role="menuitem"><i class="fas fa-file-download"></i> Export Text</a>
            </div>
          </div>
          
          <div id="editableContent" contenteditable="false">
            <p>Responses or other content will appear here.</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  
  <script src="/geminiPrompt.json"></script> 
  <script src="/Pages/JS/chat.js"></script>
</body>
</html>
