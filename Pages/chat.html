<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Narrative</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Pages/styles/chat.css">
</head>
<body>

    <nav>
        <div class="logo">Aura.</div>
        <ul class="nav-links">
            <li><a href="#"><i class="fa-solid fa-house"></i></a></li>
            <li><a href="#work">Work</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main class="page-wrapper">
        <div class="hero-text">
            <h1>The Midnight Glow</h1>
            <div class="social-icons">
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-x-twitter"></i>
                <i class="fa-brands fa-dribbble"></i>
            </div>
        </div>

        <div class="glow-overlay"></div>
        
        <div class="blob-container">
            <div class="shining-circle"></div>
        </div>
    </main>
    <div class="input-dock-wrapper">
        <div class="outer-box">
          <div class="inner-circle-bar">
            <textarea id="userInput" placeholder="Ask AI..." rows="1"></textarea>
            <button id="sendBtn" class="icon-only-btn">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    
</body>
</html>
